<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ثبت نام</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../src/css/sweetalert2.min.css">
    <link rel="stylesheet" href="../plugins/bootstrap/css/bootstrap.rtl.css"/>
    <link rel="stylesheet" href="../src/css/style.css"/>
    <link rel="stylesheet" href="../src/css/login.css"/>
</head>
<body>
<button id="corner-button" class="btn btn-primary">بازگشت</button>

<!-- TODO: Set the form available in mobile-->
<div class="login-form signup-form container-sm" >
    <h2>ثبت نام</h2>
    
    <!-- Step 1: User Information Form -->
    <form id="user-info-form" action="">
        <div class="row d-flex flex-row justify-content-evenly">
            <div class="col-5"> 
                <p>نام کاربری</p>
                <input id="username-input" placeholder="نام کاربری خود را وارد کنید" type="text" required> 
            </div>
            <div class="col-5"> 
                <p>رمز عبور</p>
                <input id="password-input" placeholder="رمز عبور خود را وارد کنید" type="password" required>
            </div>
        </div>
        <div class="row d-flex flex-row justify-content-evenly">
            <div class="col-5"> 
                <p>نام</p>
                <input id="first-name-input" placeholder="نام خود را وارد کنید" type="text" required> 
            </div>
            <div class="col-5"> 
                <p>نام خانوادگی</p>
                <input id="last-name-input" placeholder="نام خانوادگی خود را وارد کنید" type="text" required>
            </div>
        </div>
        <div class="row d-flex flex-row justify-content-around">
            <div class="col-11"> 
                <p>ایمیل</p>
                <input id="email-input" placeholder="ایمیل خود را وارد کنید" type="email" required> 
            </div>
        </div>
        <input id="request-verification-button" type="submit" value="درخواست کد تایید">
    </form>

    <!-- Step 2: Verification Code Form -->
    <form id="verification-form" action="">
        <div class="row d-flex flex-row justify-content-around">
            <div class="col-11"> 
                <p>کد تایید ارسال شده به ایمیل خود را وارد کنید</p>
                <input id="verification-code-input" placeholder="کد تایید 8 رقمی" type="text" maxlength="8" required> 
            </div>
        </div>
        <div class="row d-flex flex-row justify-content-around mt-3">
            <div class="col-5">
                <button id="back-to-info-button" type="button" class="btn btn-secondary w-100">بازگشت</button>
            </div>
            <div class="col-5">
                <input id="complete-signup-button" type="submit" value="تکمیل ثبت نام" class="w-100">
            </div>
        </div>
        <div class="row d-flex flex-row justify-content-around mt-2">
            <div class="col-11">
                <button id="resend-code-button" type="button" class="btn btn-link w-100">ارسال مجدد کد تایید</button>
            </div>
        </div>
    </form>
</div>

<script src="../src/js/sweetalert2.all.min.js"></script>
<script type="module" src="../src/js/signup.js"></script>
</body>
</html>
